[project]
name = "ai-portfolio-admin"
version = "0.1.2"
description = "Shared admin, auth, credit, and payment contracts for portfolio apps."
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.10",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_portfolio_admin"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
