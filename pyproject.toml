[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-vectorstore2"
version = "1.1.7"
description = "App-first OpenAI vector-store backed semantic RAG workspace with ChatKit and MCP adapters."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic",
    "ai-portfolio-admin @ file:./vendor/ai-portfolio-admin/",
    "aiosqlite",
    "asyncpg",
    "clerk-backend-api",
    "colorlog",
    "fastapi",
    "fastmcp[apps]",
    "httpx",
    "itsdangerous",
    "minio",
    "openai",
    "openai-agents",
    "openai-chatkit",
    "pypdf",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
openai-vectorstore2-http = "backend.app.main:main"
openai-vectorstore2-stdio = "backend.app.mcp.stdio:main"
openai-vectorstore2-open-ragbench-eval = "backend.app.evals.open_ragbench:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "vendor/ai-portfolio-admin/src"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["backend", "tests"]
extraPaths = ["vendor/ai-portfolio-admin/src"]
venvPath = "."
venv = ".venv"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUntypedFunctionDecorator = "none"
reportUnusedFunction = "none"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "migrations*"]

[tool.setuptools.package-data]
migrations = ["script.py.mako"]
